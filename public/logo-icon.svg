<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="iconAuraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#0080FF" />
    </linearGradient>
    <linearGradient id="iconSparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Glass Border -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#iconBgGrad)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="2" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="50" cy="50" r="36" fill="#00D2FF" opacity="0.12" filter="url(#iconGlow)" />

  <!-- Precision Geometric "A" -->
  <path d="M50 21L26 77H36.5L49.5 45L62.5 77H73L50 21Z" fill="#FFFFFF" />
  
  <!-- Prismatic Floating Beam -->
  <path d="M37.5 58H61.5L57.5 49H41.5L37.5 58Z" fill="url(#iconAuraGlow)" />

  <!-- Pure Radiance Spark (Top Right) -->
  <g transform="translate(73, 23)">
    <circle cx="0" cy="0" r="4.5" fill="url(#iconSparkleGrad)" filter="url(#iconGlow)" />
    <path d="M0 -9L1.8 -1.8L9 0L1.8 1.8L0 9L-1.8 1.8L-9 0L-1.8 -1.8Z" fill="#00F2FE" />
    <circle cx="0" cy="0" r="1.8" fill="#FFFFFF" />
  </g>
</svg>
