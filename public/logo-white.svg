<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" fill="none">
  <defs>
    <linearGradient id="auraGlowWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="sparkleGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="bgGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="glowWhite" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON MONOGRAM -->
  <g transform="translate(4, 6)">
    <!-- Base Rounded Square -->
    <rect width="88" height="88" rx="22" fill="url(#bgGradWhite)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
    
    <!-- Subtle Inner Aura Glow -->
    <circle cx="44" cy="44" r="32" fill="#00D2FF" opacity="0.15" filter="url(#glowWhite)" />

    <!-- Precision Geometric "A" -->
    <path d="M44 18L24 70H33L44 41L55 70H64L44 18Z" fill="#FFFFFF" />
    
    <!-- Prismatic Floating Beam -->
    <path d="M33 53H55L51.5 45H36.5L33 53Z" fill="url(#auraGlowWhite)" />

    <!-- Pure Radiance Spark (Top Right) -->
    <g transform="translate(64, 20)">
      <circle cx="0" cy="0" r="4" fill="url(#sparkleGradWhite)" filter="url(#glowWhite)" />
      <path d="M0 -8L1.5 -1.5L8 0L1.5 1.5L0 8L-1.5 1.5L-8 0L-1.5 -1.5Z" fill="#00F2FE" />
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- TYPOGRAPHY WORDMARK -->
  <g transform="translate(112, 0)">
    <!-- Main Brand Name -->
    <text x="0" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="900" letter-spacing="-0.03em" fill="#FFFFFF">
      AURA
    </text>
    <text x="126" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="600" letter-spacing="-0.02em" fill="url(#auraGlowWhite)">
      Clean
    </text>

    <!-- Subtitle: Swiss Precision & Regional Anchor -->
    <text x="2" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.26em" fill="#94A3B8">
      BERN
    </text>
    <circle cx="68" cy="74.5" r="2" fill="#00D2FF" />
    <text x="80" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.22em" fill="#CBD5E1">
      SWISS PRECISION
    </text>

    <!-- Swiss Cross Accent -->
    <g transform="translate(244, 69)">
      <rect width="11" height="11" rx="2.5" fill="#DC2626" />
      <rect x="4.5" y="2.5" width="2" height="6" fill="#FFFFFF" />
      <rect x="2.5" y="4.5" width="6" height="2" fill="#FFFFFF" />
    </g>
  </g>
</svg>
